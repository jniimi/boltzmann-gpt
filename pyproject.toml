[project]
name = "boltzmann-gpt"
version = "0.1.0"
description = "Inference-only reference implementation of an energy-based attribute model with a frozen-LLM rendering head"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Junichiro Niimi" }]
keywords = ["energy-based-model", "deep-boltzmann-machine", "controllable-generation", "soft-prompt"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boltzmann_gpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
